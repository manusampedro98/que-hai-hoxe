name: Actualizar y publicar el radar

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
    - cron: '47 10,14,20 * * *'

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      refresh: ${{ steps.catalogue.outputs.refresh }}
    steps:
      - name: Comprobar si hace falta recuperar la actualización diaria
        id: catalogue
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          refresh=true
          if [[ "$SCHEDULE" == '47 10,14,20 * * *' ]]; then
            url="https://manusampedro98.github.io/que-hai-hoxe/eventos.json"
            cutoff=$(date -u -d 'today 06:23 UTC' +%s)
            if stamp=$(curl -fsS --max-time 20 --max-filesize 8388608 "$url?check=$GITHUB_RUN_ID" |
                       jq -er '.last_successful_import_at | strings | select(test("T.*(Z|[+-][0-9]{2}:[0-9]{2})$"))') &&
               imported=$(date -d "$stamp" +%s) &&
               (( imported >= cutoff && imported <= $(date +%s) )); then
              refresh=false
            fi
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "Regenerar el catálogo: $refresh" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.refresh == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    steps:
      - name: Leer el código
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Instalar Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          check-latest: true
      - name: Leer ruta pública de Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Instalar dependencias verificadas
        run: |
          python -c "import sys; raise SystemExit(sys.version_info < (3, 14, 10))"
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-pages.lock
      - name: Consultar la Xunta, generar y revisar la web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          python -m app.pages --base-path "$PAGES_BASE_PATH" --output dist/pages
          python -m scripts.audit_publication --site dist/pages --base-path "$PAGES_BASE_PATH"
      - name: Preparar artefacto estático
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar los archivos verificados
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
